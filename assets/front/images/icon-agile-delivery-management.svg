  </defs>
  <circle cx="256" cy="256" r="248" fill="#111111"/>
  <circle cx="256" cy="256" r="248" fill="url(#bg1)"/>
  <!-- Outer rotating circle top arc -->
  <path d="M 90 256 A 166 166 0 0 1 422 256" stroke="#111111" stroke-width="28" fill="none" stroke-linecap="round"/>
  <!-- Outer rotating circle bottom arc -->
  <path d="M 422 256 A 166 166 0 0 1 90 256" stroke="#111111" stroke-width="28" fill="none" stroke-linecap="round"/>
  <!-- Arrow at top right -->
  <polygon points="422,256 392,218 392,294" fill="#111111"/>
  <!-- Arrow at top left -->
  <polygon points="90,256 120,218 120,294" fill="#111111"/>
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="80" fill="#FFD700" stroke="#111111" stroke-width="18"/>
  <!-- Checkmark inside -->
  <polyline points="216,256 244,284 300,218" stroke="#111111" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Extra curved arrows left side -->
  <path d="M 70 190 Q 38 256 70 322" stroke="#111111" stroke-width="20" fill="none" stroke-linecap="round"/>
  <polygon points="70,190 48,162 96,168" fill="#111111"/>
  <!-- Extra curved arrows right side -->
  <path d="M 442 322 Q 474 256 442 190" stroke="#111111" stroke-width="20" fill="none" stroke-linecap="round"/>
