<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"/></clipPath>
    <linearGradient id="gPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B21A8"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="256" fill="#0D0D0D"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#9333EA" stroke-width="6" opacity="0.4"/>

  <!-- Graph bars background glow -->
  <rect x="80" y="260" width="44" height="110" rx="8" fill="#9333EA" opacity="0.15"/>
  <rect x="140" y="210" width="44" height="160" rx="8" fill="#9333EA" opacity="0.15"/>
  <rect x="200" y="170" width="44" height="200" rx="8" fill="#9333EA" opacity="0.15"/>
  <rect x="260" y="140" width="44" height="230" rx="8" fill="#9333EA" opacity="0.15"/>
  <rect x="320" y="100" width="44" height="270" rx="8" fill="#9333EA" opacity="0.15"/>

  <!-- Graph bars solid -->
  <rect x="80" y="265" width="44" height="105" rx="7" fill="url(#gPurple)" opacity="0.7"/>
  <rect x="140" y="215" width="44" height="155" rx="7" fill="url(#gPurple)" opacity="0.8"/>
  <rect x="200" y="178" width="44" height="192" rx="7" fill="url(#gPurple)" opacity="0.9"/>
  <rect x="260" y="148" width="44" height="222" rx="7" fill="url(#gBlue)"/>
  <rect x="320" y="108" width="44" height="262" rx="7" fill="url(#gBlue)"/>

  <!-- Trend line -->
  <polyline points="102,255 162,205 222,168 282,138 342,98"
    stroke="#E879F9" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="102" cy="255" r="8" fill="#E879F9"/>
  <circle cx="162" cy="205" r="8" fill="#E879F9"/>
  <circle cx="222" cy="168" r="8" fill="#E879F9"/>
  <circle cx="282" cy="138" r="8" fill="#E879F9"/>
  <circle cx="342" cy="98" r="8" fill="#E879F9"/>
  <polygon points="342,98 328,82 358,84" fill="#E879F9"/>

  <!-- Baseline -->
  <line x1="68" y1="370" x2="444" y2="370" stroke="#444" stroke-width="3"/>

  <!-- UCES label -->
  <text x="256" y="56" font-family="'Arial Black', Arial, sans-serif" font-size="22" font-weight="900"
