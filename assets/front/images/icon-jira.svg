    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="248" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#1a1a1a" stroke-width="14"/>
  <!-- Jira diamond logo centered - bigger -->
